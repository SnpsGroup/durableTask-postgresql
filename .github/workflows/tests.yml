name: Tests

on:
  pull_request:
    branches:
      - main
      - vnext
      - desenv
  push:
    branches:
      - main
      - vnext
      - desenv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Integration & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the provider's target (PostgreSQL 17+) and the integration test suite.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Block until Postgres is accepting connections before tests start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration tests read this env var to locate the service container.
      POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # Run the test project. The integration tests auto-deploy the schema and run against the
      # service container. Tests that require the DB early-return when it is unreachable, so the
      # service container above is what actually exercises them.
      - name: Run tests
        run: dotnet test tests/DurableTask.PostgreSQL.Tests/ --configuration Release --no-build --logger "console;verbosity=normal"
